    .liquid-glass {

      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-strong {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);

      overflow: hidden;
    }

    .liquid-glass-strong::before {
      content: "";

      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,

        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,

    function FadingVideo({ src, className, style, seamlessLoop = false }) {
      const videoRef = useRef(null);
      const rafRef = useRef(null);
      const fadingOutRef = useRef(false);
      const timeoutRef = useRef(null);
      const FADE_MS = 500;
      const FADE_OUT_LEAD = 0.55;

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return undefined;
        let hls = null;

        const fadeTo = (target, duration) => {
          cancelAnimationFrame(rafRef.current);
          const start = performance.now();
          const from = parseFloat(video.style.opacity || "0") || 0;

          const tick = (now) => {
            const elapsed = Math.min((now - start) / duration, 1);
            const next = from + (target - from) * elapsed;
            video.style.opacity = String(next);
            if (elapsed < 1) rafRef.current = requestAnimationFrame(tick);
          };

          rafRef.current = requestAnimationFrame(tick);
        };

        const handleLoadedData = () => {
          video.style.opacity = "0";
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === "function") playPromise.catch(() => {});
          fadeTo(1, FADE_MS);
        };

        const handleTimeUpdate = () => {
          if (seamlessLoop) return;
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const handleEnded = () => {
          if (seamlessLoop) return;
          video.style.opacity = "0";
          timeoutRef.current = setTimeout(() => {
            video.currentTime = 0;
            const playPromise = video.play();
            if (playPromise && typeof playPromise.catch === "function") playPromise.catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        };

        video.addEventListener("loadeddata", handleLoadedData);
        video.addEventListener("timeupdate", handleTimeUpdate);
        video.addEventListener("ended", handleEnded);
        if (src.endsWith(".m3u8") && window.Hls && window.Hls.isSupported()) {
          hls = new window.Hls();
          hls.loadSource(src);
          hls.attachMedia(video);
        } else {
          video.src = src;
          video.load();
        }

        return () => {
          cancelAnimationFrame(rafRef.current);
          clearTimeout(timeoutRef.current);
          video.removeEventListener("loadeddata", handleLoadedData);
          video.removeEventListener("timeupdate", handleTimeUpdate);
          video.removeEventListener("ended", handleEnded);
          if (hls) hls.destroy();
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          className={`video-surface ${className}`}
          style={style}
          autoPlay
          muted
          loop={seamlessLoop}
          playsInline
          preload="auto"
        />
      );
    }
    window.FadingVideo = FadingVideo;

    function BlurText({ text, className, align = "center" }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const node = ref.current;
        if (!node) return undefined;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              observer.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        observer.observe(node);
        return () => observer.disconnect();
      }, []);

      return (
        <p ref={ref} className={`${className} flex flex-wrap row-gap-fix`} style={{ display: "flex", flexWrap: "wrap", justifyContent: align === "left" ? "flex-start" : "center", rowGap: "0.1em" }}>

              key={`${word}-${i}`}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={visible ? {
                filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                opacity: [0, 0.5, 1],
                y: [50, -5, 0],
              } : undefined}
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
              style={{ display: "inline-block", marginRight: "0.28em" }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

          cover: "Images/generate/ig_0ee375064cdd42460169f452f7a0048191aa3003f9ec10ba49.png",

      const scrollRail = (direction) => {
        if (!railRef.current) return;
        railRef.current.scrollBy({ left: direction * 460, behavior: "smooth" });
      };

      return (
        <section id="projects" className="relative min-h-screen overflow-hidden bg-black px-8 py-28 md:px-16 lg:px-20">
          <div className="mx-auto max-w-7xl">
            <motion.div {...entrance} className="flex items-end justify-between gap-6">
              <div>
                <h2 className="text-6xl italic leading-[0.9] tracking-[-3px] text-white font-heading md:text-7xl lg:text-[6rem]">Projects</h2>
                <p className="mt-6 max-w-[42rem] text-base font-light leading-snug text-white/72 font-body md:text-lg">
                  AI Agent products, coding workflows, and practical product experiments built around usable intelligence.
                </p>
              </div>
              <div className="hidden items-center gap-3 md:flex">
                <button onClick={() => scrollRail(-1)} className="liquid-glass flex h-12 w-12 items-center justify-center rounded-full text-white" type="button" aria-label="Previous project">
                  <ChevronLeft />
                </button>
                <button onClick={() => scrollRail(1)} className="liquid-glass flex h-12 w-12 items-center justify-center rounded-full text-white" type="button" aria-label="Next project">
                  <ChevronRight />
                </button>
              </div>
            </motion.div>
            <div ref={railRef} className="mt-14 flex snap-x gap-6 overflow-x-auto scroll-smooth pb-6 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
              {projects.map((project) => (
                <div key={project.name} className="snap-start">
                  <ProjectCard project={project} />
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }
    window.Projects = Projects;

    function HobbyCard({ hobby, onToggle }) {
      return (
        <motion.article
          {...entrance}
          layoutId={`hobby-card-${hobby.title}`}
          className="liquid-glass overflow-hidden rounded-[1.25rem]"
        >
          <button onClick={onToggle} className="block w-full text-left" type="button" aria-label={`Open ${hobby.title}`}>
            <motion.div layoutId={`hobby-cover-${hobby.title}`} className="relative h-64 overflow-hidden bg-black">
              <img src={hobby.cover} alt="" className="h-full w-full object-cover opacity-[0.88]" />
              <div className="absolute inset-0 bg-black/25" />
              <div className="absolute right-5 top-5 liquid-glass flex h-11 w-11 items-center justify-center rounded-full text-white">
                <PlusIcon className="h-5 w-5" />
              </div>
            </motion.div>
            <motion.div layoutId={`hobby-copy-${hobby.title}`} className="p-6">
              <div className="flex items-start justify-between gap-4">
                <div>
                  <h3 className="text-3xl italic leading-none text-white font-heading md:text-4xl">{hobby.title}</h3>
                  <p className="mt-3 max-w-[34ch] text-base font-light leading-snug text-white/82 font-body">{hobby.summary}</p>
                </div>
                <span className="liquid-glass shrink-0 rounded-full px-3 py-1 text-xs font-medium text-white/90 font-body">{hobby.tag}</span>
              </div>
            </motion.div>
          </button>
        </motion.article>
      );
    }
    window.HobbyCard = HobbyCard;

    function HobbyOverlay({ hobby, onClose }) {
      if (!hobby) return null;
      return (
        <motion.div
          className="fixed inset-0 z-[9000] flex items-center justify-center bg-black/70 px-6 py-24 backdrop-blur-sm md:px-12"
          initial={{ opacity: 0 }}
          animate={{ opacity: 1 }}
          exit={{ opacity: 0 }}
          onClick={onClose}
        >
          <motion.article
            layoutId={`hobby-card-${hobby.title}`}
            className="liquid-glass max-h-[calc(100vh-8rem)] w-full max-w-5xl overflow-hidden rounded-[1.25rem]"
            onClick={(event) => event.stopPropagation()}
          >
            <motion.div layoutId={`hobby-cover-${hobby.title}`} className="relative h-[42vh] min-h-[20rem] overflow-hidden bg-black">
              <img src={hobby.cover} alt="" className="h-full w-full object-cover opacity-[0.9]" />
              <div className="absolute inset-0 bg-black/20" />
              <button onClick={onClose} className="absolute right-5 top-5 liquid-glass flex h-12 w-12 items-center justify-center rounded-full text-white" type="button" aria-label="Close hobby detail">
                <PlusIcon className="h-5 w-5 rotate-45" />
              </button>
            </motion.div>
            <motion.div layoutId={`hobby-copy-${hobby.title}`} className="p-7 md:p-9">
              <div className="flex items-start justify-between gap-5">
                <div>
                  <h3 className="text-4xl italic leading-none text-white font-heading md:text-6xl">{hobby.title}</h3>
                  <p className="mt-4 max-w-[42rem] text-base font-light leading-snug text-white/82 font-body md:text-lg">{hobby.summary}</p>
                </div>
                <span className="liquid-glass shrink-0 rounded-full px-4 py-1.5 text-sm font-medium text-white/90 font-body">{hobby.tag}</span>
              </div>
              <p className="mt-6 max-w-[52rem] text-base font-light leading-relaxed text-white/72 font-body md:text-lg">{hobby.detail}</p>
            </motion.div>
          </motion.article>
        </motion.div>
      );
    }
    window.HobbyOverlay = HobbyOverlay;

    function Hobbies() {
      const [openIndex, setOpenIndex] = useState(null);
      const hobbies = [
        {
          title: "Digital Creation",
          tag: "Creative",
          cover: "Images/generate/ig_0ee375064cdd42460169f452f7a0048191aa3003f9ec10ba49.png",
          summary: "Exploring visual identity, character design, and AI-assisted image generation.",
          detail: "I enjoy shaping abstract ideas into visual systems, testing different styles, and using AI tools to make personal concepts more expressive and memorable.",
        },
        {
          title: "Music & Guitar",
          tag: "Sound",
          cover: "Images/generate/ig_011d9e7295af421f0169f464adddac81979d2fe03e38ab4d19.png",
          summary: "A quiet habit for relaxing, listening, and staying sensitive to rhythm.",
          detail: "Music helps me reset my attention. I like the craft of building atmosphere, whether that means listening deeply, practicing guitar, or noticing how sound changes the mood of a space.",
        },
        {
          title: "Product Thinking",
          tag: "Thinking",
          cover: "Images/generate/ig_0ee375064cdd42460169f45035ac1081918eb15ae7fac72ea6.png",
          summary: "Collecting small product ideas and turning them into interaction experiments.",
          detail: "Outside formal work, I keep observing useful tools, interface details, and user behavior. Many hobby notes eventually become product sketches or AI workflow experiments.",
        },
      ];

      return (
        <section id="hobbies" className="relative min-h-screen bg-black px-8 py-28 md:px-16 lg:px-20">
          <div className="mx-auto max-w-7xl">
            <motion.header {...entrance} className="mb-14">
              <h2 className="text-6xl italic leading-[0.9] tracking-[-3px] text-white font-heading md:text-7xl lg:text-[6rem]">Hobbies</h2>
              <p className="mt-6 max-w-[40rem] text-base font-light leading-snug text-white/72 font-body md:text-lg">
                Personal interests that keep the product work more observant, playful, and human.
              </p>
            </motion.header>
            <div className="grid grid-cols-1 gap-6 md:grid-cols-3">
              {hobbies.map((hobby, index) => (
                <HobbyCard
                  key={hobby.title}
                  hobby={hobby}
                  onToggle={() => setOpenIndex(index)}
                />
              ))}
            </div>
          </div>
          <HobbyOverlay hobby={openIndex === null ? null : hobbies[openIndex]} onClose={() => setOpenIndex(null)} />
        </section>
      );
    }
    window.Hobbies = Hobbies;

    function App() {
      return (
        <main className="bg-black text-white">
          <Navbar />
          <Hero />
          <Capabilities />
          <Projects />
          <Hobbies />
        </main>
      );
    }
    window.App = App;

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
