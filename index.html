<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinematic Space Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ["Instrument Serif", "serif"],
            body: ["Barlow", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "9999px",
          },
        },
      },
    };
  </script>
  <style>
    html {
      scroll-behavior: smooth;
      background: #000;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-strong {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass-strong::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .video-surface {
      opacity: 0;
      will-change: opacity;
    }

    @media (max-width: 767px) {
      .hero-title {
        letter-spacing: -2px !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script>window.Motion = window.FramerMotion || window.Motion;</script>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;
    const { motion } = window.Motion;

    const originalConsoleError = console.error;
    console.error = (...args) => {
      const first = String(args[0] || "");
      if (first.includes("Each child in a list should have a unique")) return;
      originalConsoleError(...args);
    };

    function ArrowUpRight({ className = "h-6 w-6" }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M7 17L17 7" />
          <path d="M7 7h10v10" />
        </svg>
      );
    }
    window.ArrowUpRight = ArrowUpRight;

    function PlayIcon({ className = "h-6 w-6" }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="6 4 20 12 6 20 6 4" />
        </svg>
      );
    }
    window.PlayIcon = PlayIcon;

    function OutlineClockIcon() {
      return (
        <svg className="h-7 w-7 text-white" viewBox="0 0 28 28" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="14" cy="14" r="10" />
          <path d="M14 8v6l4 2.5" />
        </svg>
      );
    }
    window.OutlineClockIcon = OutlineClockIcon;

    function OutlineGlobeIcon() {
      return (
        <svg className="h-7 w-7 text-white" viewBox="0 0 28 28" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="14" cy="14" r="10" />
          <path d="M4 14h20" />
          <path d="M14 4c2.5 2.7 3.7 6 3.7 10S16.5 21.3 14 24" />
          <path d="M14 4c-2.5 2.7-3.7 6-3.7 10S11.5 21.3 14 24" />
        </svg>
      );
    }
    window.OutlineGlobeIcon = OutlineGlobeIcon;

    function MaterialIcon({ path }) {
      return (
        <svg className="h-6 w-6 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d={path} />
        </svg>
      );
    }
    window.MaterialIcon = MaterialIcon;

    function FadingVideo({ src, className, style, seamlessLoop = false }) {
      const videoRef = useRef(null);
      const rafRef = useRef(null);
      const fadingOutRef = useRef(false);
      const timeoutRef = useRef(null);
      const FADE_MS = 500;
      const FADE_OUT_LEAD = 0.55;

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return undefined;
        let hls = null;

        const fadeTo = (target, duration) => {
          cancelAnimationFrame(rafRef.current);
          const start = performance.now();
          const from = parseFloat(video.style.opacity || "0") || 0;

          const tick = (now) => {
            const elapsed = Math.min((now - start) / duration, 1);
            const next = from + (target - from) * elapsed;
            video.style.opacity = String(next);
            if (elapsed < 1) rafRef.current = requestAnimationFrame(tick);
          };

          rafRef.current = requestAnimationFrame(tick);
        };

        const handleLoadedData = () => {
          video.style.opacity = "0";
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === "function") playPromise.catch(() => {});
          fadeTo(1, FADE_MS);
        };

        const handleTimeUpdate = () => {
          if (seamlessLoop) return;
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const handleEnded = () => {
          if (seamlessLoop) return;
          video.style.opacity = "0";
          timeoutRef.current = setTimeout(() => {
            video.currentTime = 0;
            const playPromise = video.play();
            if (playPromise && typeof playPromise.catch === "function") playPromise.catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        };

        video.addEventListener("loadeddata", handleLoadedData);
        video.addEventListener("timeupdate", handleTimeUpdate);
        video.addEventListener("ended", handleEnded);
        if (src.endsWith(".m3u8") && window.Hls && window.Hls.isSupported()) {
          hls = new window.Hls();
          hls.loadSource(src);
          hls.attachMedia(video);
        } else {
          video.src = src;
          video.load();
        }

        return () => {
          cancelAnimationFrame(rafRef.current);
          clearTimeout(timeoutRef.current);
          video.removeEventListener("loadeddata", handleLoadedData);
          video.removeEventListener("timeupdate", handleTimeUpdate);
          video.removeEventListener("ended", handleEnded);
          if (hls) hls.destroy();
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          className={`video-surface ${className}`}
          style={style}
          autoPlay
          muted
          loop={seamlessLoop}
          playsInline
          preload="auto"
        />
      );
    }
    window.FadingVideo = FadingVideo;

    function BlurText({ text, className, align = "center" }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const node = ref.current;
        if (!node) return undefined;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              observer.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        observer.observe(node);
        return () => observer.disconnect();
      }, []);

      return (
        <p ref={ref} className={`${className} flex flex-wrap row-gap-fix`} style={{ display: "flex", flexWrap: "wrap", justifyContent: align === "left" ? "flex-start" : "center", rowGap: "0.1em" }}>
          {text.split(" ").map((word, i) => (
            <motion.span
              key={`${word}-${i}`}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={visible ? {
                filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                opacity: [0, 0.5, 1],
                y: [50, -5, 0],
              } : undefined}
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
              style={{ display: "inline-block", marginRight: "0.28em" }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }
    window.BlurText = BlurText;

    const entrance = {
      initial: { filter: "blur(10px)", opacity: 0, y: 20 },
      whileInView: { filter: "blur(0px)", opacity: 1, y: 0 },
      viewport: { once: true, amount: 0.25 },
      transition: { duration: 0.7, ease: "easeOut" },
    };

    function Navbar() {
      const links = ["Home", "About Me", "Projects", "Resume", "Hobbies"];
      return (
        <nav className="fixed top-4 left-0 right-0 z-50 px-8 lg:px-16">
          <div className="mx-auto flex max-w-7xl items-center justify-between">
            <a href="#hero" className="liquid-glass flex h-12 w-12 items-center justify-center rounded-full text-3xl italic leading-none text-white font-heading" aria-label="Astro home">
              <span className="-translate-y-0.5">g</span>
            </a>
            <div className="liquid-glass hidden items-center rounded-full px-1.5 py-1.5 md:flex">
              {links.map((link) => (
                <a key={link} href={link === "Home" ? "#hero" : "#capabilities"} className="px-3 py-2 text-sm font-medium text-white/90 font-body">
                  {link}
                </a>
              ))}
              <a href="#capabilities" className="ml-1 flex items-center gap-2 rounded-full bg-white px-4 py-2 text-sm font-medium text-black font-body whitespace-nowrap">
                Contact Me <ArrowUpRight className="h-4 w-4" />
              </a>
            </div>
            <div className="h-12 w-12" aria-hidden="true" />
          </div>
        </nav>
      );
    }
    window.Navbar = Navbar;

    function Hero() {
      return (
        <section id="hero" className="relative flex min-h-screen overflow-hidden bg-black">
          <FadingVideo
            src="https://stream.mux.com/O9KR2ldtszUeixlGSG01vh164FE7WxayyiOuKPGNKJMU.m3u8"
            className="absolute inset-0 z-0 h-full w-full object-cover object-center"
            seamlessLoop
          />
          <div className="relative z-10 flex min-h-screen w-full flex-col">
            <Navbar />
            <div className="absolute left-1/2 bottom-[6vh] z-20 -translate-x-1/2">
              <motion.div {...entrance} transition={{ ...entrance.transition, delay: 1.0 }} className="liquid-glass flex items-center gap-3 rounded-full px-1.5 py-1.5 font-body">
                <span className="rounded-full bg-white px-3 py-1 text-xs font-semibold text-black">New</span>
                <span className="pr-3 text-sm text-white/90 whitespace-nowrap">Vibe Code development completed & published</span>
              </motion.div>
            </div>
            <div className="flex flex-1 items-start justify-start px-8 pt-40 text-left md:px-16 lg:px-20 lg:pt-48">
              <div className="flex w-full flex-col items-start">
                <motion.h1
                  {...entrance}
                  transition={{ ...entrance.transition, delay: 0.55 }}
                  className="hero-title max-w-[36rem] text-left font-heading text-5xl italic leading-[1.02] tracking-[-2px] text-white md:text-[3.4rem] lg:text-[3.85rem]"
                >
                  <span className="block">Building useful AI products with LLM, AI Agent and prompt design</span>
                  <span className="mt-6 block max-w-[31rem] text-4xl leading-[1.02] tracking-[-1.5px] text-white/90 md:text-[2.65rem] lg:text-[2.8rem]">
                    Exploring the underlying principles of artificial intelligence
                  </span>
                </motion.h1>

                <motion.p {...entrance} transition={{ ...entrance.transition, delay: 0.8 }} className="mt-4 max-w-[46rem] text-sm font-light leading-tight text-white font-body md:text-base">
                  I’m an AI enthusiast skilled in AI application development, familiar with LLM fundamentals, AI agent logic and prompt engineering. Aiming to create real-world, usable artificial intelligence solutions.
                </motion.p>

              </div>
            </div>
          </div>
        </section>
      );
    }
    window.Hero = Hero;

    function CapabilityCard({ iconPath, tags, title, body }) {
      return (
        <motion.article
          {...entrance}
          className="liquid-glass flex min-h-[360px] flex-col rounded-[1.25rem] p-6"
        >
          <div className="flex items-start justify-between gap-4">
            <div className="liquid-glass flex h-11 w-11 shrink-0 items-center justify-center rounded-[0.75rem]">
              <MaterialIcon path={iconPath} />
            </div>
            <div className="flex max-w-[76%] flex-wrap justify-end gap-2">
              {tags.map((tag) => (
                <span key={tag} className="liquid-glass rounded-full px-4 py-1.5 text-xs font-medium text-white/95 font-body whitespace-nowrap md:text-sm">
                  {tag}
                </span>
              ))}
            </div>
          </div>
          <div className="flex-1" />
          <div className="mt-6">
            <h3 className="text-3xl italic leading-none tracking-[-1px] text-white font-heading md:text-4xl">{title}</h3>
            <p className="mt-4 max-w-[34ch] text-base font-light leading-[1.35] text-white/90 font-body md:text-[17px]">{body}</p>
          </div>
        </motion.article>
      );
    }
    window.CapabilityCard = CapabilityCard;

    function Capabilities() {
      const cards = [
        {
          title: "Who I Am",
          iconPath: "M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z",
          tags: ["Profile", "Intro"],
          body: "I am an AI product practitioner focusing on AI application and AI Agent development. I am passionate about turning advanced AI technology into practical, user-friendly products for real business needs.",
        },
        {
          title: "Tech Stack",
          iconPath: "M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3l4.1 4.1-3 3-4.2-4.1C.5 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4Z",
          tags: ["Skills", "Tech"],
          body: "Solid background in web structure, frontend interaction and AI tool ecosystem. Familiar with product prototype design, requirement analysis and AI function iteration for intelligent products.",
        },
        {
          title: "Core Focus",
          iconPath: "M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1Zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7Z",
          tags: ["Professional Focus"],
          body: "Mainly engaged in AI product design, AI Agent logic construction and intelligent application landing. Dedicate to exploring innovative AI solutions and building high-quality AI interactive products.",
        },
      ];

      return (
        <section id="capabilities" className="relative min-h-screen overflow-hidden bg-black">
          <FadingVideo
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4"
            className="absolute inset-0 z-0 h-full w-full object-cover object-[center_46%]"
          />
          <div className="relative z-10 flex min-h-screen flex-col px-8 pb-10 pt-32 md:px-16 lg:px-20 lg:pt-36">
            <motion.header {...entrance} className="mb-auto">
              <h2 className="max-w-[34rem] text-6xl italic leading-[0.9] tracking-[-3px] text-white font-heading md:text-7xl lg:text-[6rem]">
                About Me
              </h2>
            </motion.header>
            <div className="mt-16 grid grid-cols-1 gap-6 md:grid-cols-3">
              {cards.map((card, i) => (
                <CapabilityCard key={card.title} {...card} />
              ))}
            </div>
          </div>
        </section>
      );
    }
    window.Capabilities = Capabilities;

    function App() {
      return (
        <main className="bg-black text-white">
          <Hero />
          <Capabilities />
        </main>
      );
    }
    window.App = App;

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
